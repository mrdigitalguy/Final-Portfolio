<!doctype html><html><head><meta charset="utf-8"><title>KP Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Figtree,sans-serif;display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.p{display:grid;place-items:center;gap:40px;padding:60px}.d{background:#000;color:#fff}.l{background:#fff;color:#000}
img{width:160px}.row{display:flex;align-items:center;gap:16px;font-size:28px;line-height:1.1}.row img{width:64px}</style></head>
<body><div class="p d"><img src="kp-mark-white.svg"><div class="row"><img src="kp-mark-white.svg"><span>Kabi<br>Prasad</span></div></div>
<div class="p l"><img src="kp-mark-black.svg"><div class="row"><img src="kp-mark-black.svg"><span>Kabi<br>Prasad</span></div></div></body></html>
